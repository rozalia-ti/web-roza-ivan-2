<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вторая лаба</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body>
    <header class="site-header">
        <div class="site-header__inner">
            <h1>Список студентов</h1>
            <button type="button" class="button" data-action="add">Добавить студента</button>
        </div>
    </header>

    <main class="main">
        <form id="filter-form" class="filter">
            <input type="text" id="filter-fullName" placeholder="ФИО">
            <input type="text" id="filter-group" placeholder="Группа">
            <input type="text" id="filter-isuId" placeholder="ИСУ ID">
            <input type="number" id="filter-dormitory" placeholder="Общежитие">
            <input type="number" id="filter-room" placeholder="Комната">
            <input type="date" id="filter-checkInDate" title="Срок заселения">
            <label class="filter__label">
                <input type="checkbox" id="filter-isForeigner">
                Иностранец
            </label>
            <button type="submit">Применить</button>
            <button type="reset">Сбросить</button>
        </form>

        <div class="table-wrapper">
            <table class="students-table">
                <thead>
                    <tr>
                        <th>ФИО</th>
                        <th>Группа</th>
                        <th>ИСУ ID</th>
                        <th>Общежитие</th>
                        <th>Комната</th>
                        <th colspan="3">Действия</th>
                    </tr>
                </thead>

                <tbody id="students-table-body"></tbody>
            </table>
        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
